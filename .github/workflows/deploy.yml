name: Deploy HYRO to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, on ne coupe pas un deploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # Tente d'activer Pages automatiquement. Si le jeton du workflow n'en a
      # pas le droit (réglage du dépôt), on retombe sur une simple lecture :
      # il suffit alors d'activer une fois Pages dans Settings → Pages →
      # "Build and deployment" → Source : GitHub Actions.
      - name: Setup Pages (avec activation automatique)
        id: pages_auto
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Pages
        if: steps.pages_auto.outcome == 'failure'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
